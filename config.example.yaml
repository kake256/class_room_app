# 設定テンプレート。cp config.example.yaml config.yaml して実値を埋める。
# config.yaml は個人情報(コースID・学生ID・課題ID)を含むため gitignore 対象。
vllm:
  base_url: "http://host.docker.internal:8000/v1"   # ホスト直実行なら http://localhost:8000/v1
  api_key: "EMPTY"
  model: "Qwen/Qwen2.5-VL-7B-Instruct"   # 一次採点(甘い=高recallの粗選別網)
  temperature: 0.0
  max_tokens: 1500

grading:
  runs: 2                # 1答案あたりの採点回数
  concurrency: 4         # asyncio 並列数(4〜6推奨)

# Web UI/MCPの一括採点で使う高速経路。本文はまとめ、図表答案だけ画像で処理する。
hybrid_grading:
  text_batch_max_items: 12
  text_batch_max_chars: 10000
  concurrency: 4
  review_confidence_threshold: 0.6

render:
  dpi: 150
  max_pages: 8

classroom:
  course_id: "<CLI利用時の既定コースID>" # Web UIは担当コースから選択する
  credentials_file: "credentials.json"
  token_file: "token.json"
  # Web UIのOAuth tokenはGoogle利用者ごとに匿名ファイル名で分離保存する。
  # 省略時は paths.data_dir/oauth_tokens。token_fileはCLI後方互換のみ。
  user_token_dir: "data/oauth_tokens"
  # Web UIからのOAuth完了後にGoogleが戻すURL。installed型はこのlocalhost既定値を利用可能。
  # web型クライアントではGoogle Cloud Consoleの「承認済みのリダイレクトURI」へ完全一致で登録する。
  oauth_redirect_uri: "http://localhost:8800/oauth2callback"
  oauth_state_ttl_seconds: 600

paths:
  data_dir: "data"

# courseWorkId → 課題キー(rubric.ASSIGNMENT_SPECS のキー: rf/svm/adaboost/
# kansou1/tokubetsu0511/sukina/ai_kansou/application_research/distance/knn/
# face_detection)。新しい課題は ./run.sh list で courseWorkId を確認して追加。
assignments:
  "<courseWorkId>": rf

late_penalty: 1

report:
  # この時間を超えたClassroom metaでは通常集計を拒否する。
  meta_max_age_seconds: 900

web_auth:
  # 本番ではCGA_SESSION_SECRET環境変数に十分長いランダム値を設定する。
  # 未設定時は paths.data_dir/session_secret に0600で生成し、再起動後も再利用する。
  session_secret: null
  session_ttl_seconds: 43200
  secure_cookie: false   # HTTPS公開時はtrue
  # 本番でtrueにすると、roles未設定時は全ログインを拒否する。
  require_explicit_roles: false
  allowed_emails: []     # 例: ["teacher@example.edu"]（実在アドレスをexampleへ書かない）
  allowed_domains: []    # 例: ["example.edu"]。両方空ならOAuthで許可された全ユーザー
  roles:
    # 上からadmin > grader > viewerの優先順。email/domainは小文字へ正規化される。
    # 全roleが空の場合のみ、上記の従来allowlist許可者をgraderとして扱う（開発互換）。
    admin:
      emails: []
      domains: []
    grader:
      emails: []
      domains: []
    viewer:
      emails: []
      domains: []

audit:
  # 省略時は paths.data_dir/audit.jsonl。actorは匿名化し、操作情報のみ追記する。
  path: null

integration:
  # Classroomページ上のuserscriptから /grades を読むためだけの専用token。
  # Web UIはこの値を使わず、GoogleログインCookieで認証する。
  token: null

draft_batches:
  ttl_seconds: 600

mcp:
  # HTTPS公開時は実際のoriginを指定する。OAuth resourceはこの値 + /mcp。
  public_url: "http://localhost:8800"

mcp_oauth:
  access_ttl_seconds: 3600
  refresh_ttl_seconds: 2592000
  max_clients: 200

model_controller:
  base_url: "http://host.docker.internal:8810"
  timeout_seconds: 1500

pairwise:                # 審判フェーズ(refine)
  model: "Qwen/Qwen3-VL-8B-Instruct-FP8"
  judge_runs: 2
  crit_prune: 2.0
  anchor_student_id: "<基準答案(2点相当)のstudent_id>"   # 課題ごとに選び直す
  anchor_max_pages: 4
  candidate_max_pages: 6

# 感想文系課題(KANSOU/EFFORT)向け。一次・judgeとも3点一致(candidate_3)の答案を
# 「確定/要確認」に仕分ける。judge観点合計(crit_min_sum、2回の低い方)が
# max_crit_sum(=満点)に達していれば無条件で確定。満点未満・min_crit_sum以上の
# 僅差の場合のみ、(a)本文が長い(min_chars以上)、または(b)講義の技術用語
# (rubric.COURSE_KEYWORDS)に複数言及している(min_keyword_hits以上)答案を
# 「システムが自動確認済みの3点」(auto_3)に格上げし、教員の目視確認リスト
# (candidate_3)から外す。実験課題(EXPERIMENT)には適用しない。
length_bonus:
  enabled: false
  rubric_keys: ["KANSOU", "EFFORT"]
  max_crit_sum: 3.0        # judge観点合計がこれ以上(=2回とも全観点満点)なら無条件で確定
  min_crit_sum: 2.5        # これ未満は対象外(crit_pruneで既にauto_2降格済みのはず)
  min_chars: 350           # 満点未満でも本文がこれ以上長ければ確定(具体性ボーナス)
  min_keyword_hits: 3      # または講義の技術用語への言及数がこれ以上
