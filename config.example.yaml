# 設定テンプレート。cp config.example.yaml config.yaml して実値を埋める。
# config.yaml は個人情報(コースID・学生ID・課題ID)を含むため gitignore 対象。
vllm:
  base_url: "http://host.docker.internal:8000/v1"   # ホスト直実行なら http://localhost:8000/v1
  api_key: "EMPTY"
  model: "Qwen/Qwen2.5-VL-7B-Instruct"   # 一次採点(甘い=高recallの粗選別網)
  temperature: 0.0
  max_tokens: 1500

grading:
  runs: 2                # 1答案あたりの採点回数
  concurrency: 4         # asyncio 並列数(4〜6推奨)

render:
  dpi: 150
  max_pages: 8

classroom:
  course_id: "<コースID>"                # Classroom URLの c/ の後ろのID(またはBase64形式)
  credentials_file: "credentials.json"
  token_file: "token.json"

paths:
  data_dir: "data"

# courseWorkId → 課題キー(rubric.ASSIGNMENT_SPECS のキー: rf/svm/adaboost/
# kansou1/tokubetsu0511/sukina)。新しい課題は ./run.sh list で courseWorkId を確認して追加。
assignments:
  "<courseWorkId>": rf

late_penalty: 1

api:                     # 採点結果API(grader/api.py、localhost:8800)
  token: null            # 設定すると X-API-Key ヘッダ必須になる(未設定=localhost前提で認証なし)

pairwise:                # 審判フェーズ(refine)
  model: "Qwen/Qwen3-VL-8B-Instruct-FP8"
  judge_runs: 2
  crit_prune: 2.0
  anchor_student_id: "<基準答案(2点相当)のstudent_id>"   # 課題ごとに選び直す
  anchor_max_pages: 4
  candidate_max_pages: 6

# 感想文系課題(KANSOU/EFFORT)向け。一次・judgeとも3点一致(candidate_3)の答案を
# 「確定/要確認」に仕分ける。judge観点合計(crit_min_sum、2回の低い方)が
# max_crit_sum(=満点)に達していれば無条件で確定。満点未満・min_crit_sum以上の
# 僅差の場合のみ、(a)本文が長い(min_chars以上)、または(b)講義の技術用語
# (rubric.COURSE_KEYWORDS)に複数言及している(min_keyword_hits以上)答案を
# 「システムが自動確認済みの3点」(auto_3)に格上げし、教員の目視確認リスト
# (candidate_3)から外す。実験課題(EXPERIMENT)には適用しない。
length_bonus:
  enabled: false
  rubric_keys: ["KANSOU", "EFFORT"]
  max_crit_sum: 3.0        # judge観点合計がこれ以上(=2回とも全観点満点)なら無条件で確定
  min_crit_sum: 2.5        # これ未満は対象外(crit_pruneで既にauto_2降格済みのはず)
  min_chars: 350           # 満点未満でも本文がこれ以上長ければ確定(具体性ボーナス)
  min_keyword_hits: 3      # または講義の技術用語への言及数がこれ以上
